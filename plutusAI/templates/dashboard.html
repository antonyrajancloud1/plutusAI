{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlutuZ - Algo Trading Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              50: 'var(--surface-50)',
              100: 'var(--surface-100)',
              200: 'var(--surface-200)',
              300: 'var(--surface-300)',
              400: 'var(--surface-400)',
              500: 'var(--surface-500)',
              600: 'var(--surface-600)',
              700: 'var(--surface-700)',
              800: 'var(--surface-800)',
              900: 'var(--surface-900)',
            },
            primary: {
              50: 'var(--primary-50)',
              100: 'var(--primary-100)',
              200: 'var(--primary-200)',
              300: 'var(--primary-300)',
              400: 'var(--primary-400)',
              500: 'var(--primary-500)',
              600: 'var(--primary-600)',
              700: 'var(--primary-700)',
              800: 'var(--primary-800)',
              900: 'var(--primary-900)',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 3a12 12 0 0 0 8.5 3 12 12 0 0 1-8.5 15A12 12 0 0 1 3.5 6 12 12 0 0 0 12 3z'/><path d='M9 12l2 2 4-4'/></svg>">
  <style>
    :root, [data-theme="dark"] {
      --surface-50: #f8fafc;
      --surface-100: #f1f5f9;
      --surface-200: #e2e8f0;
      --surface-300: #cbd5e1;
      --surface-400: #94a3b8;
      --surface-500: #64748b;
      --surface-600: #475569;
      --surface-700: #334155;
      --surface-800: #1e293b;
      --surface-900: #0f172a;
      --primary-50: #eef2ff;
      --primary-100: #e0e7ff;
      --primary-200: #c7d2fe;
      --primary-300: #a5b4fc;
      --primary-400: #818cf8;
      --primary-500: #6366f1;
      --primary-600: #4f46e5;
      --primary-700: #4338ca;
      --primary-800: #3730a3;
      --primary-900: #312e81;
    }
    [data-theme="light"] {
      --surface-900: #f8fafc;
      --surface-800: #ffffff;
      --surface-700: #f1f5f9;
      --surface-600: #e2e8f0;
      --surface-500: #cbd5e1;
      --surface-400: #94a3b8;
      --surface-300: #64748b;
      --surface-200: #475569;
      --surface-100: #334155;
      --surface-50: #0f172a;
      --primary-500: #4f46e5;
      --primary-400: #6366f1;
      --primary-600: #4338ca;
    }
    * { scrollbar-width: thin; scrollbar-color: var(--surface-600) var(--surface-800); }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-track { background: var(--surface-800); }
    *::-webkit-scrollbar-thumb { background: var(--surface-600); border-radius: 3px; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--surface-900); color: var(--surface-50); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: calc(200px + 100%) 0; } }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .page-enter { animation: fadeIn 0.25s ease-out forwards; }
    .skeleton { background: linear-gradient(90deg, var(--surface-800) 25%, var(--surface-700) 50%, var(--surface-800) 75%); background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite; border-radius: 0.5rem; }
    .sidebar-overlay { display: none; }
    @media (max-width: 1023px) {
      .sidebar-open .sidebar-overlay { display: block; }
      .sidebar-open .sidebar-panel { transform: translateX(0); }
    }
    .sidebar-panel { transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
    .nav-item { transition: all 0.15s ease; position: relative; }
    .nav-item:hover { background: rgba(99, 102, 241, 0.08); }
    .nav-item.active { background: rgba(99, 102, 241, 0.12); }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 24px; background: var(--primary-500); border-radius: 0 3px 3px 0; }
    .card { background: var(--surface-800); border: 1px solid var(--surface-700); border-radius: 0.75rem; }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse-dot 2s ease-in-out infinite; }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>
  <script type="module" src="{% static 'js/ui/index.js' %}"></script>
</body>
</html>
